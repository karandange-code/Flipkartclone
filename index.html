<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style> 
        *{
            margin: 0;padding: 0;
            box-sizing: border-box;
        }
        body{
            overflow-x: hidden;
            background-color:#F1F3F6 ;
            color: #212121;
        }
        header{
            display: flex;
            height: 70px;
            align-items: center;
            gap: 25px;
            padding: 10px 30px;
            background-color: #2874F0;
            color: white;
            
        }
        .button button{
            padding: 9px;
            background-color:#FFFFFF;
            color: #2874F0;
            border-radius: 9px;
            transition: all 0.2s ease;

             
        }
        .button button:hover{
            transform: scale(1.09);
            background-color: burlywood;
        }

        .logo{
            display: flex;
            align-items: center;
           padding-top: 10px;
           height: 70px;
            
        }
        .search{
             flex: 1;
        }
        .search input{
            width: 100%;
            max-width: 600px;
            height: 40px;
            padding: 0 15px;
            font-size: 15px;
            background-color: #FFFFFF;
            color: #212121;
            
        }
        .seller{
            white-space: nowrap;
        }
        .cart{
            white-space: nowrap;
            
        }
        section{
            display: flex;
            align-items: center;
            
            padding: 15px
            30px;
            width: 100%;
            justify-content: space-around;
             
           
             
        }
.category{
    flex: 1;
    text-align: center;
    padding-top: 27px;
    background-color: #FFFFFF;
            color:#212121 ;
      

}
   .category img{
    width: 110px;
    height: 80px;
    object-fit: contain;
   }
  
.hero{
    width:100%;
    height: 600px;
    overflow: hidden;
}
 
 .slide{
    display: flex;
     width:  300%;
     height: 600px;
    animation: slidein 9s infinite;
     
      
 }
 .slide img{
    width: 33.333%;
    height: 600px;
    object-fit: cover;
     
 }
 @keyframes slidein{
    0%{
        transform: translatex(0);
    }
    30%{
        transform: translatex(0);
    }
    33%{
        transform: translatex(-33.333%);
    }
    63%{
        transform: translatex(-33.333%);
    }
    66%{
        transform: translatex(-66.666%);
    }
    96%{
        transform: translatex(-66.666%);
    }
    100%{
        transform: translatex(0);
    }
 }
 h2{
    text-align: center;
    padding-top: 11px;
    padding-bottom: 11px;
 }
 .productsection{
    display: flex;
    gap: 20px;
    width: 100%;
    background-color: #FFFFFF;
    color: #212121 ;
 }
 .productsection>div{
    height: 400px;
    flex: 1;
    border: 2px solid  #E0E0E0;
    border-radius: 9px ; 
    padding: 11px;
    text-align: center;
    transition: all 0.4s ease;
 }
 .productsection>div:hover{
    transform: translatey(-11px);
    background-color:  #FAFAFA; 
    box-shadow:  0 5px 15px rgba(0, 0, 0, 0.15);
    border-radius: 11px;
 }

  

 .productsection img{
    height: 200px;
    width: 180px;
    object-fit: contain;
 }
 .productsection h3{
    margin: 10px 0;
 }
 .productsection p{
    margin: 10px 0;
      color: #388E3C;;
 }
 .productsection button{
    padding: 8px 15px;
    transition: all 0.3s ease;
    background-color: #2874F0;
    color: white;
 }
  .productsection button:hover{
    transform: translatey(-7px) scale(1.09);
       
    border-radius: 19px;
    background-color: darkseagreen;
    color: aliceblue;
  }

 footer{
    display: flex;
    justify-content: space-evenly;
    align-self: center;
    gap: 110px;
    padding: 37px;
    background-color: #172337;
    color: #FFFFFF;
 }
  
    @media (max-width: 1024px) {

    header {
        gap: 15px;
        padding: 0 15px;
    }

    .search {
        flex: 1;
    }

    .search input {
        max-width: 450px;
    }

    section {
        gap: 20px;
        padding: 15px;
    }

    .category img {
        width: 80px;
        height: 70px;
    }

    .hero {
        width: 100%;
        height: 450px;
    }

    .slide {
        height: 450px;
    }

    .slide img {
        height: 450px;
    }

    .productsection {
        gap: 10px;
    }

    .productsection > div {
        height: 350px;
    }

    .productsection img {
        width: 140px;
        height: 170px;
    }

}
@media (max-width: 767px) {

    /* HEADER */

    header {
        height: auto;
        flex-wrap: wrap;
        padding: 15px;
        gap: 15px;
    }

    .logo img {
        width: 90px;
    }

    .search {
        order: 3;
        flex-basis: 100%;
    }

    .search input {
        width: 100%;
        max-width: none;
    }


    /* CATEGORIES */

    section {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        padding: 15px 5px;
    }

    .category {
        width: auto;
        padding-top: 10px;
    }

    .category img {
        width: 60px;
        height: 60px;
    }

    .category p {
        font-size: 12px;
    }


    /* HERO */

    .hero {
        width: 100%;
        height: 220px;
    }

    .slide {
        height: 220px;
    }

    .slide img {
        height: 220px;
    }


    /* PRODUCTS */

    h2 {
        font-size: 20px;
        padding: 10px;
    }

    .productsection {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        padding: 10px;
    }

    .productsection > div {
        height: 330px;
        padding: 10px;
    }

    .productsection img {
        width: 100%;
        height: 160px;
    }

    .productsection h3 {
        font-size: 16px;
    }

    .productsection p {
        font-size: 14px;
    }

    .productsection button {
        padding: 7px 10px;
    }


    /* FOOTER */

    footer {
        flex-direction: column;
        gap: 20px;
        padding: 25px;
    }

}
 
    

    </style>
</head>
<body>
     <header> 
        <div class="logo">
            <img src="/logo.png" alt="" width="123">

        </div>
           <div class="search">
            <input type="text" placeholder="search product,brand and more">

           </div>
          <div class="button">
            <button type="button">login</button>
            </div>

            <div class="seller">
            <strong> Become Seller </strong>
            
          </div>
           <div class="cart">
           <strong> Cart</strong> 
           </div>
            

     </header>
     <main> 
        <section> 
            <div class="category">
                <img src="/flipkart.png" alt="" >
                <p> grocerry</p>

            </div>
            <div class="category">
                <img src="/mobile.png" alt="">
                <p> mobile</p>
            </div>

            <div class="category">
                <img src="/fashion.png" alt="">
                <p> fashion</p>

            </div>
            <div class="category">
                <img src="/electronic.png" alt="">
                <p> electronic</p>

            </div>
        </section>
        <div class="hero">
            <div class="slide">
                <img src="/banner.png" alt="">
                <img src="/banner2.png" alt="">
                <img src="/banr.png" alt="">
            </div>
        </div>
        <h2> Best Deal</h2>
        <div class="productsection">
           
            <div class="mobile">
                <img src="/productphone.png" alt="">
                <h3> smart phone</h3>
                <p> starting 15,999</p>
                <button type="button"> view product</button>

            </div>
            <div class="watch">
                <img src="/watch.png" alt="">
                <h3> <strong> watch</strong></h3>
                <p> 2,999</p>
                <button type="button"> view product</button>

            </div>
            <div class="laptop">
                <img src="/laptop.png" alt="">
                <h3> laptop</h3>
                <p> 19,999</p>
                <button type="button">view product </button>
            </div>
            <div class="headphone">
                <img src="/headphone.png" alt="">
                <p> 3,999</p>
                <button type="button"> view product</button>
            </div>
            
        </div>
     </main>
      
<footer>

    <div>
        <h3>About</h3>
        <p>Contact Us</p>
        <p>About Us</p>
        <p>Careers</p>
    </div>

    <div>
        <h3>Help</h3>
        <p>Payments</p>
        <p>Shipping</p>
        <p>Returns</p>
    </div>

    <div>
        <h3>Consumer Policy</h3>
        <p>Cancellation</p>
        <p>Terms</p>
        <p>Privacy</p>
    </div>

</footer>
      
</body>
</html>
